        // Fetch comments with Firestore listener or fallback
        function loadComments(adId) {
            if (activeUnsubscribe) {
                activeUnsubscribe();
                activeUnsubscribe = null;
            }

            const local = getLocalComments(adId);
            renderCommentsList(local);

            // If Firebase loaded successfully
            if (window.db && window.firestoreTools) {
                try {
                    const { collection, onSnapshot, query, orderBy } = window.firestoreTools;
                    const colRef = collection(window.db, `comments_${adId}`);
                    const q = query(colRef, orderBy("timestamp", "desc"));

                    activeUnsubscribe = onSnapshot(q, (snapshot) => {
                        const firebaseComments = [];
                        snapshot.forEach(doc => {
                            firebaseComments.push(doc.data());
                        });

                        console.log(`🔥 Conexión Firestore activa: ${firebaseComments.length} comentarios cargados en tiempo real.`);

                        if (firebaseComments.length > 0) {
                            renderCommentsList(firebaseComments);
                        }
                    }, (err) => {
                        console.log("Firestore offline/reading from local cache:", err);
                    });
                } catch(e) {
                    console.log("Firebase listener fallback to local storage.");
                }
            }
        }

                    const author = authorInput?.value.trim() || 'Anónimo';
                    const text = textInput?.value.trim();

                    if (!text) {
                        alert('Por favor escribe tu opinión antes de enviar.');
                        return;
                    }

                    const newComment = {
                        author,
                        text,
                        rating: selectedRating,
                        date: new Date().toLocaleDateString('es-SV', { day: '2-digit', month: 'short', year: 'numeric' }),
                        timestamp: Date.now()
                    };

                    // Save local backup immediately
                    saveLocalComment(activeAd.id, newComment);

                    // Track comment in Google Analytics
                    if (typeof gtag === 'function') {
                        gtag('event', 'post_review', {
                            item_id: activeAd.id,
                            rating: selectedRating
                        });
                    }

                    // Push to Firestore if available
                    if (window.db && window.firestoreTools) {
                        try {
                            const { collection, addDoc } = window.firestoreTools;
                            await addDoc(collection(window.db, `comments_${activeAd.id}`), newComment);
                        } catch(e) {
                            console.log("Saved to local storage.");
                        }
                    }

                    // Reset form
                    if (textInput) textInput.value = '';
                    loadComments(activeAd.id);
                    renderAdsList(adsData);
                });
            }
			
			
			
			// Escuchar el botón físico/gesto de "Atrás" del teléfono
            window.addEventListener('popstate', function() {
                const lightboxModal = document.getElementById('lightboxModal');

                // 1. Si la foto en pantalla completa (lightbox) está abierta, la cierra primero
                if (lightboxModal && !lightboxModal.classList.contains('hidden')) {
                    window.closeLightbox();
                    return;
                }

                // 2. Si la tarjeta de la chica está abierta, la cierra sin salir de la web
                if (adModal && !adModal.classList.contains('hidden')) {
                    adModal.classList.add('hidden');
                    if (activeUnsubscribe) {
                        activeUnsubscribe();
                        activeUnsubscribe = null;
                    }
                }
            });
			
			
        });
		
		
		
    </script>
</body>
</html>
